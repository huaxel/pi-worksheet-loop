name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Only tag pushes on the default branch publish; never PRs, branches,
    # or manual runs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # npm OpenID Connect: the workflow mints a short-lived publish token
      # at publish time — no NPM_TOKEN secret is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm CLI with trusted-publishing support
        run: npm install --global npm@11.5.1
      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi
      - name: Publish to npm (OIDC trusted publisher)
        # npm CLI 11.5.1+ exchanges the GitHub OIDC identity directly;
        # trusted publishing automatically generates provenance.
        run: npm publish --access public
